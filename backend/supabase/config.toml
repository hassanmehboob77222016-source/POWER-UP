project_id = "powerup"

[db]
# Supabase CLI's default local Postgres major version. Set this to match the
# linked project's `show server_version;` result when validating a remote schema.
major_version = 15

[functions.ai-backup-advisor]
# Guests have no user JWT. The function validates the public project key,
# verifies signed-in JWTs, and enforces quotas before calling the model.
verify_jwt = false
